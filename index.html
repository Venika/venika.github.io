<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Website Updating</title> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; color: #ffffff; background: radial-gradient(circle at top left, #2563eb, transparent 40%), radial-gradient(circle at bottom right, #0ea5e9, transparent 40%), linear-gradient(135deg, #0f172a, #1e3a8a); overflow: hidden; } .container { width: min(90%, 650px); padding: 55px 40px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px; background: rgba(255, 255, 255, 0.10); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.25); } .icon { width: 80px; height: 80px; margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255, 255, 255, 0.15); font-size: 36px; } h1 { margin-bottom: 18px; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 700; letter-spacing: -1px; } p { color: rgba(255, 255, 255, 0.82); font-size: 1.1rem; line-height: 1.7; max-width: 500px; margin: 0 auto; } .status { display: inline-block; margin-top: 30px; padding: 10px 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); color: #bfdbfe; font-size: 0.9rem; font-weight: 600; } .dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #60a5fa; box-shadow: 0 0 12px #60a5fa; animation: pulse 1.5s infinite; } @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } } @media (max-width: 480px) { .container { padding: 40px 25px; } p { font-size: 1rem; } } </style> </head> <body> <main class="container"> <div class="icon">🔧</div>
